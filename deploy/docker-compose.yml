services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topolink
      POSTGRES_PASSWORD: topolink
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topolink -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      DATABASE_URL: postgres://topolink:topolink@postgres:5432/orders?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-secret
      PAYMENT_BASE_URL: http://host.docker.internal:7070
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
      - "9090:9090"

  consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/consumer"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://topolink:topolink@postgres:5432/orders?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: payment.succeeded
      KAFKA_GROUP_ID: order-service
      JWT_SECRET: dev-secret
      PAYMENT_BASE_URL: http://host.docker.internal:7070
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started
