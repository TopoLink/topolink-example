name: demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, Topolink rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: Topolink rule verification
        run: ./scripts/verify.sh

  action:
    name: Topolink Action (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: TopoLink/topolink@v1
        with:
          fail-on: none
          diff: auto
